<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Maker</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0e0e0e; --panel:#171717; --panel-2:#1f1f1f; --line:rgba(250,250,250,.08); --line-2:rgba(250,250,250,.14);
  --fg:#f2f2f2; --dim:#9a9a9a; --lime:#68f12b; --bad:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 Inter,system-ui,sans-serif}
.app{display:grid; grid-template-columns:1fr 360px; height:100vh}
.stage{display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line)}
.stage__bar{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.stage__bar b{font-weight:600; flex:1}
.stage__view{flex:1; min-height:0; display:grid; place-items:center; padding:20px;
  background:repeating-conic-gradient(#1a1a1a 0 25%, #141414 0 50%) 0 0 / 24px 24px}
.stage__view svg{width:min(100%, 62vh); height:auto; max-height:100%; display:block}
.poses{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); overflow-x:auto; scrollbar-width:thin}
.pose{flex:0 0 auto; width:84px; border:1px solid var(--line-2); border-radius:8px; background:var(--panel); cursor:pointer; padding:4px 4px 6px; color:var(--dim); font-size:11px; text-align:center}
.pose svg{width:100%; height:auto; display:block}
.pose:hover{border-color:rgba(250,250,250,.3)}
.pose.is-sel{border-color:var(--lime); color:var(--fg)}
.side{display:flex; flex-direction:column; min-height:0; background:var(--panel)}
.side__body{overflow:auto; flex:1; scrollbar-width:thin; scrollbar-color:rgba(250,250,250,.12) transparent}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer; padding:10px 12px; font-weight:600; list-style:none; display:flex; justify-content:space-between}
summary::after{content:'+'; color:var(--dim)} details[open] summary::after{content:'−'}
.grp{padding:2px 12px 12px; display:flex; flex-direction:column; gap:9px}
.row{display:grid; grid-template-columns:110px 1fr 40px; gap:8px; align-items:center}
.row--2{grid-template-columns:110px 1fr}
.row label{color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row output{font:11px 'Geist Mono',monospace; color:var(--dim); text-align:right}
input,select,button{font:inherit; color:inherit}
select{background:var(--bg); border:1px solid var(--line-2); border-radius:6px; height:26px; padding:0 6px; width:100%}
input[type=range]{accent-color:var(--lime); width:100%}
input[type=color]{width:100%; height:26px; padding:0; border:1px solid var(--line-2); border-radius:6px; background:none; cursor:pointer}
input[type=checkbox]{accent-color:var(--lime)}
.check{display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px; cursor:pointer}
.btn{height:30px; padding:0 10px; border-radius:6px; border:1px solid var(--line-2); background:var(--panel-2); cursor:pointer; white-space:nowrap}
.btn:hover{border-color:rgba(250,250,250,.3)}
.btn--lime{background:var(--lime); color:#0b0b0b; border-color:var(--lime); font-weight:600}
.btns{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.btns .btn--full{grid-column:1 / -1}
.palettes{display:flex; flex-wrap:wrap; gap:6px}
.pal{width:28px; height:28px; border-radius:50%; border:2px solid var(--line-2); cursor:pointer; padding:0}
.pal:hover{border-color:var(--fg)}
.msg{padding:8px 12px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); min-height:34px}
.msg.is-ok{color:var(--lime)}
@media (max-width:820px){
  .app{grid-template-columns:1fr; height:auto}
  .stage{border-right:0; border-bottom:1px solid var(--line)}
  .stage__view{min-height:60vh; padding:16px}
  .stage__view svg{width:100%}
  .poses{padding:10px 16px}
  .grp,summary{padding-left:16px; padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="stage__bar">
      <b>Character Maker</b>
      <button class="btn" id="undoPose" title="Về dáng gốc">Đặt lại</button>
      <button class="btn btn--lime" id="dlSvgTop">Tải SVG</button>
    </div>
    <div class="stage__view" id="view"></div>
    <div class="poses" id="poses"></div>
  </section>

  <aside class="side">
    <div class="side__body">
      <details open>
        <summary>Màu sắc</summary>
        <div class="grp">
          <div class="palettes" id="palettes"></div>
          <div id="colorRows"></div>
        </div>
      </details>

      <details open>
        <summary>Dáng</summary>
        <div class="grp" id="poseRows"></div>
      </details>

      <details>
        <summary>Biểu cảm &amp; chi tiết</summary>
        <div class="grp">
          <div class="row row--2"><label>Mắt</label>
            <select id="eyes"><option value="normal">Bình thường</option><option value="happy">Cười ^^</option><option value="wink">Nháy mắt</option><option value="wow">Ngạc nhiên</option><option value="closed">Nhắm</option></select></div>
          <div class="row row--2"><label>Miệng</label>
            <select id="mouth"><option value="smile">Mỉm cười</option><option value="open">Cười to</option><option value="flat">Thẳng</option><option value="o">Chữ O</option></select></div>
          <label class="check"><input type="checkbox" id="headHands"> Hai tay trên đầu</label>
          <label class="check"><input type="checkbox" id="earring"> Khuyên tai</label>
          <label class="check"><input type="checkbox" id="pocket"> Túi bụng</label>
          <label class="check"><input type="checkbox" id="tail"> Đuôi</label>
        </div>
      </details>

      <details open>
        <summary>Viền &amp; nền</summary>
        <div class="grp">
          <label class="check"><input type="checkbox" id="sticker"> Viền sticker trắng</label>
          <div class="row"><label>Độ dày viền</label><input type="range" id="stickerW" min="2" max="24" step="1"><output id="stickerWo"></output></div>
          <div class="row"><label>Nét vẽ</label><input type="range" id="lineW" min="1.5" max="6" step="0.5"><output id="lineWo"></output></div>
          <label class="check"><input type="checkbox" id="bgOn"> Có màu nền</label>
          <div class="row row--2"><label>Màu nền</label><input type="color" id="bgColor"></div>
        </div>
      </details>

      <details open>
        <summary>Xuất file</summary>
        <div class="grp">
          <div class="row row--2"><label>Kích thước PNG</label>
            <select id="pngSize"><option>1024</option><option selected>2048</option><option>4096</option></select></div>
          <div class="btns">
            <button class="btn btn--lime" id="dlSvg">SVG (vector)</button>
            <button class="btn" id="dlPng">PNG</button>
            <button class="btn" id="copySvg">Copy mã SVG</button>
            <button class="btn" id="dlSheet">Tất cả dáng (SVG)</button>
          </div>
        </div>
      </details>
    </div>
    <div class="msg" id="msg">SVG mở được bằng Illustrator, Figma, Inkscape. Mọi phần là path riêng, đổi màu tiếp được.</div>
  </aside>
</div>

<script>
// ---------- dữ liệu ----------
const COLOR_FIELDS = [
  ['body', 'Thân'], ['white', 'Bụng / tay / chân'], ['collar', 'Vòng cổ'], ['bell', 'Chuông'],
  ['tailC', 'Đuôi'], ['skin', 'Da'], ['hair', 'Tóc'], ['cheek', 'Má'], ['ink', 'Nét viền'],
];
const BASE_COLORS = {body:'#1f8fe3', white:'#ffffff', collar:'#e5322d', bell:'#f6c41c', tailC:'#e5322d', skin:'#dfa877', hair:'#4b2c17', cheek:'#f49bb0', ink:'#1d1410'};
const PALETTES = [
  {body:'#1f8fe3', collar:'#e5322d', bell:'#f6c41c', tailC:'#e5322d'},
  {body:'#f7d24a', collar:'#e5322d', bell:'#ffffff', tailC:'#e5322d'},
  {body:'#f58bb5', collar:'#7c3aed', bell:'#f6c41c', tailC:'#7c3aed'},
  {body:'#43c06b', collar:'#f6c41c', bell:'#e5322d', tailC:'#f6c41c'},
  {body:'#e2463d', collar:'#1f8fe3', bell:'#f6c41c', tailC:'#1f8fe3'},
  {body:'#8b5cf6', collar:'#f6c41c', bell:'#f6c41c', tailC:'#f58bb5'},
  {body:'#ff8a3d', collar:'#1d1410', bell:'#f6c41c', tailC:'#1d1410'},
  {body:'#68f12b', collar:'#0e0e0e', bell:'#f6c41c', tailC:'#0e0e0e'},
  {body:'#2b2b2b', collar:'#e5322d', bell:'#f6c41c', tailC:'#e5322d'},
  {body:'#9fd8f5', collar:'#f58bb5', bell:'#ffffff', tailC:'#f58bb5'},
];
// la/ra = vai (0 = buông xuống, 90 = dang ngang, 180 = giơ thẳng), lb/rb = gập khuỷu, ll/rl = chân
const POSE_FIELDS = [
  ['tilt', 'Nghiêng người', -40, 40], ['head', 'Nghiêng đầu', -30, 30], ['lift', 'Bay lên / hạ', -30, 40],
  ['la', 'Vai trái', -60, 180], ['lb', 'Khuỷu trái', -150, 150],
  ['ra', 'Vai phải', -60, 180], ['rb', 'Khuỷu phải', -150, 150],
  ['ll', 'Chân trái', -40, 90], ['rl', 'Chân phải', -40, 90],
];
const PRESETS = [
  {id:'fly',   label:'Bay',         p:{tilt:-14, head:12, lift:10, la:82, lb:8, ra:28, rb:-24, ll:-22, rl:48}, e:'normal', m:'smile'},
  {id:'stand', label:'Đứng',        p:{tilt:0, head:0, lift:0, la:14, lb:0, ra:14, rb:0, ll:6, rl:6}, e:'normal', m:'smile'},
  {id:'wave',  label:'Vẫy tay',     p:{tilt:-3, head:-7, lift:0, la:14, lb:0, ra:120, rb:50, ll:6, rl:6}, e:'happy', m:'smile'},
  {id:'jump',  label:'Nhảy',        p:{tilt:0, head:0, lift:24, la:138, lb:18, ra:138, rb:18, ll:38, rl:38}, e:'happy', m:'open'},
  {id:'hips',  label:'Chống nạnh',  p:{tilt:0, head:5, lift:0, la:62, lb:-122, ra:62, rb:-122, ll:12, rl:12}, e:'normal', m:'flat'},
  {id:'win',   label:'Chiến thắng', p:{tilt:5, head:-6, lift:6, la:18, lb:0, ra:170, rb:0, ll:4, rl:24}, e:'wink', m:'open'},
  {id:'sit',   label:'Ngồi',        p:{tilt:0, head:6, lift:-14, la:28, lb:-28, ra:28, rb:-28, ll:72, rl:72}, e:'closed', m:'smile'},
  {id:'dance', label:'Nhảy múa',    p:{tilt:-9, head:9, lift:5, la:122, lb:-58, ra:40, rb:72, ll:32, rl:-12}, e:'happy', m:'open'},
  {id:'run',   label:'Chạy',        p:{tilt:8, head:-4, lift:8, la:64, lb:-66, ra:-18, rb:58, ll:34, rl:-14}, e:'normal', m:'open'},
  {id:'shock', label:'Hoảng hốt',   p:{tilt:0, head:0, lift:4, la:150, lb:-40, ra:150, rb:-40, ll:20, rl:20}, e:'wow', m:'o'},
];
const DEFAULTS = {
  colors:{...BASE_COLORS}, pose:{...PRESETS[0].p}, preset:'fly', eyes:'normal', mouth:'smile',
  headHands:true, earring:true, pocket:true, tail:true, sticker:true, stickerW:10, lineW:3, bgOn:false, bgColor:'#ffffff',
};
const KEY = 'chande-character-v1';
let st = load();

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s) return {...DEFAULTS, ...s, colors:{...BASE_COLORS, ...s.colors}, pose:{...DEFAULTS.pose, ...s.pose}};
  }catch(e){}
  return structuredClone(DEFAULTS);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

// ---------- vẽ ----------
let SIL = false, SW = 10; // SIL = lớp bóng trắng làm viền sticker
const f1 = n => +n.toFixed(2);
function E(tag, a){
  a = {...a};
  if (SIL){
    if (a.fill !== 'none') a.fill = '#ffffff';
    a.stroke = '#ffffff';
    a['stroke-width'] = f1((+a['stroke-width'] || 0) + SW * 2);
    a['stroke-linejoin'] = 'round'; a['stroke-linecap'] = 'round';
  }
  return `<${tag} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(' ')}/>`;
}
const G = (tf, inner, id) => `<g${id ? ` id="${id}"` : ''}${tf ? ` transform="${tf}"` : ''}>${inner}</g>`;
const mirrorX = 'matrix(-1 0 0 1 400 0)';

function figure(s){
  const c = s.colors, p = s.pose, W = s.lineW, ink = c.ink;
  const shape = (d, fill, extra = {}) => E('path', {d, fill, stroke:ink, 'stroke-width':W, 'stroke-linejoin':'round', 'stroke-linecap':'round', ...extra});
  const line = (d, w = W, col = ink) => E('path', {d, fill:'none', stroke:col, 'stroke-width':w, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  const ell = (cx, cy, rx, ry, fill, extra = {}) => E('ellipse', {cx, cy, rx, ry, fill, stroke:ink, 'stroke-width':W, ...extra});
  const dir = a => { const r = a * Math.PI / 180; return [-Math.sin(r), Math.cos(r)]; };
  const pt = q => q.map(f1).join(',');

  // tay: vai -> khuỷu -> bàn tay, tính ở bên trái rồi lật sang phải
  function arm(a, b, right){
    const S = [154, 270], d1 = dir(a), E1 = [S[0] + d1[0] * 28, S[1] + d1[1] * 28], d2 = dir(a + b), H = [E1[0] + d2[0] * 26, E1[1] + d2[1] * 26];
    const d = `M${pt(S)} L${pt(E1)} L${pt(H)}`;
    const inner = line(d, 24 + W * 2) + line(d, 24, c.body) + E('circle', {cx:f1(H[0]), cy:f1(H[1]), r:15, fill:c.white, stroke:ink, 'stroke-width':W});
    return G(right ? mirrorX : '', inner, right ? 'tay-phai' : 'tay-trai');
  }
  function leg(a, right){
    const Hp = [178, 350], d1 = dir(a), F = [Hp[0] + d1[0] * 18, Hp[1] + d1[1] * 18], fc = [F[0] + d1[0] * 6, F[1] + d1[1] * 6];
    const d = `M${pt(Hp)} L${pt(F)}`;
    const inner = line(d, 30 + W * 2) + line(d, 30, c.body) + ell(f1(fc[0]), f1(fc[1]), 24, 12.5, c.white, {transform:`rotate(${f1(a * .35)} ${f1(fc[0])} ${f1(fc[1])})`});
    return G(right ? mirrorX : '', inner, right ? 'chan-phai' : 'chan-trai');
  }

  // --- đầu ---
  const hand = shape('M142,116 Q128,84 150,62 Q172,44 194,32 Q206,28 205,42 Q200,58 186,72 Q176,90 172,116 Z', c.skin)
    + shape('M150,66 Q142,52 150,46 Q158,44 160,56', c.skin)
    + line('M164,58 Q178,48 192,36', W * .7) + line('M170,66 Q184,56 196,44', W * .7) + line('M176,74 Q188,64 198,52', W * .7);
  const headHands = s.headHands ? G('', G('', hand, 'tay-dau-trai') + G(mirrorX, hand, 'tay-dau-phai'), 'tay-tren-dau') : '';
  const hairBack = shape('M138,166 Q126,108 170,96 Q200,88 230,96 Q274,108 262,166 L266,214 Q270,250 284,274 L266,266 L268,282 L252,262 L246,232 L252,176 L148,176 L154,232 L148,262 L132,282 L134,266 L116,274 Q130,250 134,214 Z', c.hair);
  const ears = ell(145, 194, 11, 14, c.skin) + ell(255, 194, 11, 14, c.skin) + line('M252,190 Q258,194 253,200', W * .7);
  const face = shape('M146,162 Q144,226 172,244 Q200,258 228,244 Q256,226 254,162 Q254,128 200,126 Q146,128 146,162 Z', c.skin);
  const earring = s.earring ? E('circle', {cx:257, cy:212, r:4.5, fill:'none', stroke:ink, 'stroke-width':W * .8}) : '';
  const bangs = shape('M140,172 Q132,108 200,100 Q268,108 260,172 L252,152 L246,170 L236,146 L226,164 L216,142 L204,160 L194,140 L182,162 L172,144 L162,166 L154,148 Z', c.hair);
  const strand = shape('M150,152 Q136,190 140,230 L132,262 L150,246 L156,262 L160,220 Q158,186 164,162 Z', c.hair);
  const brows = line('M164,181 Q176,176 189,181', W * 1.7) + line('M211,181 Q224,176 236,181', W * 1.7);
  const eyeN = (x) => ell(x, 196, 3.6, 3, ink, {stroke:'none'});
  const eyeArc = (x) => line(`M${x - 7},199 Q${x},190 ${x + 7},199`, W);
  const eyeClosed = (x) => line(`M${x - 7},195 Q${x},201 ${x + 7},195`, W);
  const eyeWow = (x) => ell(x, 196, 6, 6.5, '#ffffff', {'stroke-width':W * .8}) + ell(x, 196, 2.6, 2.6, ink, {stroke:'none'});
  const eyes = {
    normal: eyeN(178) + eyeN(222), happy: eyeArc(178) + eyeArc(222), wink: eyeN(178) + eyeArc(222),
    wow: eyeWow(178) + eyeWow(222), closed: eyeClosed(178) + eyeClosed(222),
  }[s.eyes] || '';
  const cheeks = ell(161, 215, 12, 7, c.cheek, {stroke:'none'}) + ell(239, 215, 12, 7, c.cheek, {stroke:'none'});
  const nose = line('M201,200 Q199,212 192,216 Q195,221 200,219 Q205,221 208,216', W * .8);
  const stache = shape('M200,227 Q187,221 176,227 Q166,233 161,242 Q173,236 186,237 Q196,238 200,234 Q204,238 214,237 Q227,236 239,242 Q234,233 224,227 Q213,221 200,227 Z', c.hair);
  const mouth = {
    smile: line('M191,243 Q200,249 209,243', W * .9),
    open: shape('M189,242 Q200,256 211,242 Q200,245 189,242 Z', '#c23a3a', {'stroke-width':W * .9}),
    flat: line('M192,245 L208,245', W * .9),
    o: ell(200, 246, 4.5, 5, '#c23a3a', {'stroke-width':W * .9}),
  }[s.mouth] || '';
  const head = G(`rotate(${f1(p.head)} 200 250)`,
    headHands + hairBack + ears + earring + face + G('', eyes + brows, 'mat') + cheeks + nose + mouth + stache + bangs + strand, 'dau');

  // --- thân ---
  const tail = s.tail ? line('M250,336 L262,338', W * 1.4) + E('circle', {cx:266, cy:338, r:8.5, fill:c.tailC, stroke:ink, 'stroke-width':W}) : '';
  const body = shape('M152,252 Q136,300 146,342 Q152,360 178,360 L222,360 Q248,360 254,342 Q264,300 248,252 Z', c.body);
  const belly = ell(200, 310, 42, 40, c.white);
  const pocket = s.pocket ? shape('M174,318 Q200,346 226,318 Z', c.white) : '';
  const collar = E('rect', {x:148, y:246, width:104, height:16, rx:8, fill:c.collar, stroke:ink, 'stroke-width':W});
  const bell = E('circle', {cx:200, cy:272, r:12, fill:c.bell, stroke:ink, 'stroke-width':W})
    + line('M189,268 L211,268', W * .8) + E('circle', {cx:200, cy:276, r:2.6, fill:ink}) + line('M200,277 L200,283', W * .8);

  // chân dang rộng (ngồi) vẽ đè lên thân, còn lại nằm sau thân
  const legs = leg(p.ll, false) + leg(p.rl, true), legsFront = Math.max(p.ll, p.rl) > 55;
  const inner = G('', tail, 'duoi') + (legsFront ? '' : legs) + G('', body + belly + pocket, 'than') + (legsFront ? legs : '')
    + G('', collar + bell, 'vong-co') + head + arm(p.la, p.lb, false) + arm(p.ra, p.rb, true);
  return G(`translate(0 ${f1(-p.lift)}) rotate(${f1(p.tilt)} 200 300)`, inner);
}

function render(s, size){
  SW = s.stickerW;
  let out = '';
  if (s.bgOn) out += `<rect x="-20" y="-20" width="440" height="440" fill="${s.bgColor}"/>`;
  if (s.sticker){ SIL = true; out += G('', figure(s), 'vien-sticker'); SIL = false; }
  out += G('', figure(s), 'nhan-vat');
  const wh = size ? ` width="${size}" height="${size}"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 440 440"${wh}>${out}</svg>`;
}

// ---------- giao diện ----------
const $ = id => document.getElementById(id);
const view = $('view'), msgEl = $('msg');
function msg(t, ok){ msgEl.textContent = t; msgEl.classList.toggle('is-ok', !!ok); }

function draw(){ view.innerHTML = render(st); save(); }
function drawThumbs(){
  document.querySelectorAll('.pose').forEach(b => {
    const pr = PRESETS.find(x => x.id === b.dataset.id);
    b.querySelector('i').innerHTML = render({...st, pose:pr.p, eyes:pr.e, mouth:pr.m});
    b.classList.toggle('is-sel', st.preset === pr.id);
  });
}

// màu
$('colorRows').innerHTML = COLOR_FIELDS.map(([k, l]) => `<div class="row row--2"><label>${l}</label><input type="color" data-c="${k}"></div>`).join('');
document.querySelectorAll('[data-c]').forEach(inp => {
  inp.value = st.colors[inp.dataset.c];
  inp.addEventListener('input', () => { st.colors[inp.dataset.c] = inp.value; draw(); });
  inp.addEventListener('change', drawThumbs);
});
$('palettes').innerHTML = PALETTES.map((p, i) => `<button class="pal" data-pal="${i}" title="Bảng màu ${i + 1}" style="background:linear-gradient(135deg, ${p.body} 60%, ${p.collar} 60%)"></button>`).join('');
$('palettes').addEventListener('click', e => {
  const b = e.target.closest('[data-pal]'); if (!b) return;
  Object.assign(st.colors, PALETTES[b.dataset.pal]);
  syncInputs(); draw(); drawThumbs();
});

// dáng
$('poseRows').innerHTML = POSE_FIELDS.map(([k, l, mn, mx]) =>
  `<div class="row"><label>${l}</label><input type="range" data-p="${k}" min="${mn}" max="${mx}" step="1"><output data-po="${k}"></output></div>`).join('')
  + `<button class="btn" id="mirror">Lật dáng trái ↔ phải</button>`;
document.querySelectorAll('[data-p]').forEach(inp => inp.addEventListener('input', () => {
  st.pose[inp.dataset.p] = +inp.value; st.preset = null; syncPose(); draw(); drawThumbs();
}));
$('mirror').addEventListener('click', () => {
  const p = st.pose;
  animateTo({...p, tilt:-p.tilt, head:-p.head, la:p.ra, lb:p.rb, ra:p.la, rb:p.lb, ll:p.rl, rl:p.ll});
  st.preset = null; drawThumbs();
});
$('poses').innerHTML = PRESETS.map(p => `<button class="pose" data-id="${p.id}"><i></i>${p.label}</button>`).join('');
$('poses').addEventListener('click', e => {
  const b = e.target.closest('.pose'); if (!b) return;
  const pr = PRESETS.find(x => x.id === b.dataset.id);
  st.preset = pr.id; st.eyes = pr.e; st.mouth = pr.m; syncInputs();
  animateTo(pr.p); drawThumbs();
});
$('undoPose').addEventListener('click', () => {
  const keep = st.colors; st = structuredClone(DEFAULTS); st.colors = keep;
  syncInputs(); animateTo(DEFAULTS.pose); drawThumbs();
});

let anim = 0;
function animateTo(target){
  cancelAnimationFrame(anim);
  const from = {...st.pose}, t0 = performance.now(), dur = 320;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), k = 1 - Math.pow(1 - t, 3);
    for (const key in target) st.pose[key] = from[key] + (target[key] - from[key]) * k;
    syncPose(); draw();
    if (t < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

// chi tiết + viền
['eyes', 'mouth'].forEach(k => $(k).addEventListener('change', () => { st[k] = $(k).value; draw(); }));
['headHands', 'earring', 'pocket', 'tail', 'sticker', 'bgOn'].forEach(k => $(k).addEventListener('change', () => { st[k] = $(k).checked; draw(); drawThumbs(); }));
['stickerW', 'lineW'].forEach(k => $(k).addEventListener('input', () => { st[k] = +$(k).value; $(k + 'o').textContent = st[k]; draw(); }));
['stickerW', 'lineW'].forEach(k => $(k).addEventListener('change', drawThumbs));
$('bgColor').addEventListener('input', () => { st.bgColor = $('bgColor').value; draw(); });

function syncPose(){
  document.querySelectorAll('[data-p]').forEach(inp => { inp.value = st.pose[inp.dataset.p]; });
  document.querySelectorAll('[data-po]').forEach(o => { o.textContent = Math.round(st.pose[o.dataset.po]); });
}
function syncInputs(){
  document.querySelectorAll('[data-c]').forEach(inp => { inp.value = st.colors[inp.dataset.c]; });
  ['eyes', 'mouth'].forEach(k => $(k).value = st[k]);
  ['headHands', 'earring', 'pocket', 'tail', 'sticker', 'bgOn'].forEach(k => $(k).checked = st[k]);
  ['stickerW', 'lineW'].forEach(k => { $(k).value = st[k]; $(k + 'o').textContent = st[k]; });
  $('bgColor').value = st.bgColor;
  syncPose();
}

// ---------- xuất ----------
const poseName = () => st.preset || 'custom';
// trong trang preview claude.ai thì tải qua capability downloads, trên site thì dùng link thường
const dlCap = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function download(blob, name){
  const cap = await dlCap;
  if (cap){
    try{ await cap.save({filename:name, data:blob}); }
    catch(e){ if (e?.code !== 'declined') msg('Không tải được file trong chế độ xem này.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const svgFile = (s, size) => '<?xml version="1.0" encoding="UTF-8"?>\n' + render(s, size);
function dlSvg(){ download(new Blob([svgFile(st, 1024)], {type:'image/svg+xml'}), `chande-${poseName()}.svg`); msg('Đã tải SVG.', true); }
$('dlSvg').addEventListener('click', dlSvg);
$('dlSvgTop').addEventListener('click', dlSvg);
$('dlPng').addEventListener('click', () => {
  const size = +$('pngSize').value, img = new Image();
  const url = URL.createObjectURL(new Blob([render(st, size)], {type:'image/svg+xml'}));
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    cv.getContext('2d').drawImage(img, 0, 0, size, size); URL.revokeObjectURL(url);
    cv.toBlob(b => { download(b, `chande-${poseName()}-${size}.png`); msg(`Đã tải PNG ${size}×${size}.`, true); }, 'image/png');
  };
  img.src = url;
});
$('copySvg').addEventListener('click', async () => {
  try{ await navigator.clipboard.writeText(render(st, 1024)); msg('Đã copy mã SVG — dán thẳng vào Figma được.', true); }
  catch(e){ msg('Trình duyệt chặn copy, dùng nút tải SVG.'); }
});
$('dlSheet').addEventListener('click', () => {
  const cols = 5, cell = 440, rows = Math.ceil(PRESETS.length / cols);
  const cells = PRESETS.map((pr, i) => {
    const x = (i % cols) * cell, y = Math.floor(i / cols) * (cell + 40);
    const inner = render({...st, pose:pr.p, eyes:pr.e, mouth:pr.m}).replace('<svg xmlns="http://www.w3.org/2000/svg"', `<svg x="${x}" y="${y}" width="${cell}" height="${cell}"`);
    return `<g id="dang-${pr.id}">${inner}<text x="${x + cell / 2}" y="${y + cell + 24}" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#666">${pr.label}</text></g>`;
  }).join('');
  const W = cols * cell, H = rows * (cell + 40);
  const svg = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${cells}</svg>`;
  download(new Blob([svg], {type:'image/svg+xml'}), 'chande-all-poses.svg'); msg(`Đã tải ${PRESETS.length} dáng trong 1 file SVG.`, true);
});

syncInputs(); draw(); drawThumbs();
</script>
</body>
</html>
