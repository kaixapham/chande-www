<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Editor</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0e0e0e; --panel:#171717; --panel-2:#1f1f1f; --line:rgba(250,250,250,.08); --line-2:rgba(250,250,250,.14);
  --fg:#f2f2f2; --dim:#9a9a9a; --lime:#68f12b; --warn:#ffb648; --bad:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 Inter,system-ui,sans-serif}
.app{display:grid; grid-template-columns:1fr 380px; height:100vh}
/* xem trước */
.stage{display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line)}
.stage__bar{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.stage__bar b{font-weight:600}
.stage__view{flex:1; min-height:0; display:grid; place-items:center; padding:20px; background:
  repeating-conic-gradient(#141414 0 25%, #111 0 50%) 0 0 / 24px 24px}
.stage__frame{position:relative; box-shadow:0 0 0 1px var(--line-2), 0 20px 60px rgba(0,0,0,.5); overflow:hidden}
.stage__frame canvas{display:block}
.stage__hint{position:absolute; left:10px; bottom:8px; font:11px 'Geist Mono',monospace; color:rgba(0,0,0,.45); pointer-events:none}
.scrub{display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line)}
.scrub input[type=range]{flex:1}
.scrub output{font:12px 'Geist Mono',monospace; min-width:84px; text-align:right; color:var(--dim)}
/* bảng */
.side{display:flex; flex-direction:column; min-height:0; background:var(--panel)}
.side__head{display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line)}
.side__head h1{font-size:13px; margin:0; flex:1}
.side__body{overflow:auto; flex:1; scrollbar-width:thin; scrollbar-color:rgba(250,250,250,.12) transparent}
.side__msg{padding:8px 12px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); min-height:34px}
.side__msg.is-bad{color:var(--bad)} .side__msg.is-ok{color:var(--lime)}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer; padding:10px 12px; font-weight:600; list-style:none; display:flex; justify-content:space-between}
summary::after{content:'+'; color:var(--dim)} details[open] summary::after{content:'−'}
.grp{padding:2px 12px 12px; display:flex; flex-direction:column; gap:9px}
.row{display:grid; grid-template-columns:120px 1fr 56px; gap:8px; align-items:center}
.row label{color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row label.is-changed{color:var(--warn)}
.row input[type=number]{width:100%}
.row--wide{grid-template-columns:120px 1fr}
input,select,button{font:inherit; color:inherit}
input[type=number],input[type=text],select{background:var(--bg); border:1px solid var(--line-2); border-radius:6px; height:26px; padding:0 6px}
input[type=range]{accent-color:var(--lime); width:100%}
input[type=color]{width:100%; height:26px; padding:0; border:1px solid var(--line-2); border-radius:6px; background:none}
.btn{height:28px; padding:0 10px; border-radius:6px; border:1px solid var(--line-2); background:var(--panel-2); cursor:pointer; white-space:nowrap}
.btn:hover{border-color:rgba(250,250,250,.3)}
.btn--lime{background:var(--lime); color:#0b0b0b; border-color:var(--lime); font-weight:600}
.btn--ghost{background:none}
.btn[disabled]{opacity:.5; cursor:default}
.colors{display:flex; flex-wrap:wrap; gap:6px}
.colors input{width:36px}
/* tờ */
.sheets{display:flex; flex-direction:column; gap:6px; padding:2px 12px 12px}
.sheet{border:1px solid var(--line); border-radius:8px; padding:8px; display:grid; grid-template-columns:44px 1fr; gap:8px; cursor:pointer}
.sheet.is-sel{border-color:var(--lime)}
.sheet__ph{position:relative; width:44px; height:56px; border-radius:4px; background:#222 center/cover no-repeat; cursor:pointer; outline:1px dashed transparent}
.sheet__ph:hover{outline-color:var(--lime)}
.sheet__ph em{position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-style:normal; font-size:10px; font-weight:600; background:rgba(0,0,0,.55); border-radius:inherit; opacity:0; transition:opacity .15s}
.sheet__ph:hover em{opacity:1}
.sheet__ops{display:flex; gap:2px}
.sheet__with{grid-column:1 / -1; flex-direction:row !important; align-items:center; gap:6px !important; font-size:11px !important}
.sheet__with input{width:auto !important; height:auto !important}
.imgfield{display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center}
.sheet__ops button{width:20px; height:18px; padding:0; border:1px solid var(--line-2); border-radius:4px; background:none; cursor:pointer; font-size:10px; line-height:1}
.sheet__ops button[data-del]{color:var(--bad)}
.sheet__fields{display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
.sheet__fields label{display:flex; flex-direction:column; gap:2px; font-size:10px; color:var(--dim)}
.sheet__fields input{width:100%; height:24px; font-size:11px; padding:0 4px}
.sheet__name{grid-column:1 / -1; font-size:11px; color:var(--dim); display:flex; justify-content:space-between}
.gh{padding:10px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px}
.gh[hidden]{display:none}
.gh input[type=password],.gh input[type=text]{width:100%}
kbd{font:11px 'Geist Mono',monospace; padding:1px 4px; border:1px solid var(--line-2); border-radius:4px}
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="stage__bar">
      <b>Poster Editor</b>
      <span style="color:var(--dim)">Khung xem</span>
      <select data-aspect>
        <option value="screen">Màn hiện tại − menu</option>
        <option value="1920x1000">1920 × 1000 (FHD − menu)</option>
        <option value="1440x820">1440 × 820 (MacBook 14)</option>
        <option value="2560x1360">2560 × 1360 (QHD / 5K)</option>
        <option value="1366x688">1366 × 688</option>
        <option value="custom">Tự nhập…</option>
      </select>
      <input type="number" data-cw value="1920" style="width:70px" hidden> <input type="number" data-ch value="1000" style="width:70px" hidden>
      <span style="flex:1"></span>
      <span style="color:var(--dim)">Kéo tờ để dời · <kbd>Shift</kbd>+kéo để xoay · cuộn chuột trên khung = cuộn trang</span>
    </div>
    <div class="stage__view"><div class="stage__frame" data-frame><span class="stage__hint" data-hint></span></div></div>
    <div class="scrub">
      <button class="btn" type="button" data-prev title="Tờ trước">‹</button>
      <button class="btn" type="button" data-next title="Tờ sau">›</button>
      <button class="btn" type="button" data-play>▶ Chạy thử</button>
      <input type="range" min="0" max="1" step="0.001" value="0" data-head aria-label="Tua (như cuộn trang)">
      <output data-head-out>0.00</output>
    </div>
  </section>

  <aside class="side">
    <div class="side__head">
      <h1>Thông số</h1>
      <button class="btn btn--ghost" type="button" data-reset title="Về bản đang lưu">Hoàn tác</button>
      <button class="btn btn--ghost" type="button" data-defaults title="Về mặc định trong code (chưa lưu)">Mặc định</button>
      <button class="btn btn--lime" type="button" data-save>Lưu</button>
    </div>
    <div class="side__body" data-body></div>
    <form class="gh" data-gh hidden>
      <b>Lưu thẳng lên GitHub</b>
      <span style="color:var(--dim); font-size:12px">Token fine-grained (Contents: read &amp; write, chỉ repo này) — dùng chung với CMS.</span>
      <input type="text" name="repo" placeholder="kaixapham/chande-www">
      <input type="password" name="token" placeholder="github_pat_…" autocomplete="off">
      <label style="font-size:12px; color:var(--dim)"><input type="checkbox" name="remember"> Nhớ token trên máy này</label>
      <button class="btn btn--lime" type="submit">Lưu với token này</button>
    </form>
    <div class="side__msg" data-msg>Đang nạp…</div>
  </aside>
</div>

<!-- Thông số đã lưu (nút Lưu ở trang này ghi vào đây, khoá "poster.…") -->
<script src="assets/js/chande-settings.js?v=202610101841"></script>
<script type="module" src="assets/js/poster-edit.js?v=202610101841"></script>
</body>
</html>
